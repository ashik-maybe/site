name: Deploy to GitHub Pages

on:
  # Deploy on every push to `main`; the manual trigger re-runs a deploy.
  push:
    branches: [ main ]
  workflow_dispatch:

# Least privilege for Pages deployment: read the repo, publish the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin the local toolchain version so CI and `bun.lock` stay in step.
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      # Type-check, build, and run Pagefind; a broken template cannot deploy.
      - name: Type-check and build
        run: bun run build:ci
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
