<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="Terminal prompt">
  <!-- Theme-aware favicon: Bangal palette. Hue 163.45 from the Bangladesh flag's
       green, tinted surfaces, BD green accent.
  <style>
    .tile { fill: #f8fbf9; }
    .glyph { stroke: #1f7b59; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0e1612; }
      .glyph { stroke: #65cfa2; }
    }
  </style>
  <!-- Rounded tile, echoing the site's corner radius treatment. -->
  <rect class="tile" x="2" y="2" width="32" height="32" rx="8" />
  <!-- Prompt glyph: a chevron and an underscore, drawn as rounded strokes so
       the mark stays legible at 16px. -->
  <g
    class="glyph"
    fill="none"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M13 12.5 18.5 18 13 23.5" />
    <path d="M20.5 23.5h5.5" />
  </g>
</svg>
