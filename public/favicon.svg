<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="Terminal prompt">
  <!-- Theme-aware favicon: Catppuccin Latte in light mode, Macchiato in dark,
       mauve accent in both. Browsers apply prefers-color-scheme inside an
       SVG favicon, so the mark flips with the OS, like the site does. -->
  <style>
    .tile { fill: #eff1f5; }
    .glyph { stroke: #8839ef; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #24273a; }
      .glyph { stroke: #c6a0f6; }
    }
  </style>
  <!-- Rounded tile, echoing the site's corner radius treatment. -->
  <rect class="tile" x="2" y="2" width="32" height="32" rx="8" />
  <!-- Prompt glyph: a chevron and an underscore, drawn as rounded strokes so
       the mark stays legible at 16px. -->
  <g
    class="glyph"
    fill="none"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M13 12.5 18.5 18 13 23.5" />
    <path d="M20.5 23.5h5.5" />
  </g>
</svg>
